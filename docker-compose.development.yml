name: dotaleaguebot-dev

x-logging: &development-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=20", "-c", "work_mem=2MB", "-c", "maintenance_work_mem=32MB"]
    env_file: .env.development
    volumes:
      - ./development/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *development-logging

  migrate:
    image: dotaleaguebot-bot:development
    env_file: .env.development
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    command: ["python", "-m", "database.migrate"]
    depends_on:
      db:
        condition: service_healthy
    logging: *development-logging

  site:
    image: dotaleaguebot-site:development
    restart: unless-stopped
    mem_limit: 320m
    env_file: .env.development
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      UPLOADS_DIR: /data/uploads
      NODE_OPTIONS: --max-old-space-size=192
    volumes:
      - ./development/uploads:/data/uploads
    networks:
      default: {}
      development:
        aliases: [development-site]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *development-logging

networks:
  default: {}
  development:
    external: true
    name: dotaleaguebot-development
