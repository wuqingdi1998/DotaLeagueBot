name: Deploy (main)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bot/requirements.txt
            bot/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: site/tools/arcana-replay-parser/go.sum
      - name: Check bot
        working-directory: bot
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m compileall -q .
          pip-audit -r requirements.txt
          ruff check .
          mypy database/core.py database/migrate.py cogs/website_bridge.py utils/website_notifications.py
          python -m pytest
      - name: Check site
        working-directory: site
        run: |
          cd tools/arcana-replay-parser
          go test ./...
          cd ../..
          npm ci
          npm audit
          npm run check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production images
        run: |
          docker build --tag dotaleaguebot-bot:deploy --file bot/Dockerfile .
          docker build --tag dotaleaguebot-site:deploy ./site
          docker save dotaleaguebot-bot:deploy dotaleaguebot-site:deploy |
            gzip -1 > deployment-images.tar.gz
      - name: Prepare production host
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail
            # Interrupted releases can leave large archives, old images and build cache.
            # Remove only unused Docker data; running containers and their images stay protected.
            for stale_artifact in /tmp/dotaleaguebot-*/deployment-images.tar.gz; do
              [ -f "$stale_artifact" ] || continue
              stale_dir="${stale_artifact%/*}"
              rm -f -- "$stale_artifact"
              rmdir -- "$stale_dir" 2>/dev/null || true
            done
            docker container prune --force
            docker image prune --all --force
            docker builder prune --all --force
            df -h / /tmp
            docker system df
      - name: Transfer production images
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          source: deployment-images.tar.gz
          target: /tmp/dotaleaguebot-${{ github.sha }}
      - name: Deploy bot, site and database migrations
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR=/root/DotaLeagueBot
            REPO=git@github.com:wuqingdi1998/DotaLeagueBot.git
            IMAGE_ARTIFACT_DIR=/tmp/dotaleaguebot-${{ github.sha }}
            IMAGE_ARTIFACT="$IMAGE_ARTIFACT_DIR/deployment-images.tar.gz"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch main "$REPO" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            if [ ! -s "$IMAGE_ARTIFACT" ]; then
              echo "Missing prebuilt production images." >&2
              exit 1
            fi
            gzip -dc "$IMAGE_ARTIFACT" | docker load
            rm -f "$IMAGE_ARTIFACT"
            rmdir "$IMAGE_ARTIFACT_DIR"

            if [ ! -f .env ]; then
              echo "Missing $APP_DIR/.env. Copy .env.example and fill secrets." >&2
              exit 1
            fi

            # Bind mounts keep host ownership and override image-layer
            # permissions. The site runs as uid/gid 1001 and must be able to
            # create both team emblems and profile backgrounds.
            install -d -m 0775 -o 1001 -g 1001 \
              uploads_data \
              uploads_data/team-emblems \
              uploads_data/profile-backgrounds
            chown -R 1001:1001 uploads_data

            mkdir -p backups
            if docker compose ps --status running db | grep -q db; then
              backup="backups/postgres-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
              docker compose exec -T db sh -c \
                'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' | gzip > "$backup"
            fi
            find backups -type f -name 'postgres-*.sql.gz' -mtime +14 -delete

            docker compose config --quiet
            docker compose up -d db
            docker compose run --rm migrate

            # The old deployment used PM2. Stop it only after the new images build.
            if command -v pm2 >/dev/null 2>&1 && pm2 describe DotaLeagueBot >/dev/null 2>&1; then
              pm2 stop DotaLeagueBot
              pm2 delete DotaLeagueBot
              pm2 save
            fi

            docker compose up -d --no-deps --remove-orphans bot site proxy

            for attempt in $(seq 1 30); do
              if docker compose exec -T site node -e \
                "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose logs --tail=200 site bot migrate
                exit 1
              fi
              sleep 2
            done

            public_url="https://${SITE_DOMAIN:-lsesports.ru}/api/health"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 30 "$public_url" |
                grep -q '"ok":true'; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose logs --tail=200 proxy site
                exit 1
              fi
              sleep 5
            done

            for attempt in $(seq 1 30); do
              preview_delivery="$(docker compose exec -T db sh -c \
                'psql -U "$POSTGRES_USER" "$POSTGRES_DB" -At -c \
                "SELECT COUNT(*) FILTER (WHERE status = '\''sent'\'')
                    || '\''|'\'' ||
                    COUNT(*) FILTER (WHERE status <> '\''sent'\'')
                 FROM channel_announcement_outbox
                 WHERE dedupe_key LIKE '\''season9-registration-preview-round-%'\''"')"
              if [ "$preview_delivery" = "14|0" ]; then
                echo "Delivered season 9 preview announcements: 14"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose exec -T db sh -c \
                  'psql -U "$POSTGRES_USER" "$POSTGRES_DB" -c \
                  "SELECT dedupe_key, status, attempts, last_error
                   FROM channel_announcement_outbox
                   WHERE dedupe_key LIKE '\''season9-registration-preview-round-%'\''
                   ORDER BY id"'
                docker compose logs --tail=200 bot
                exit 1
              fi
              sleep 3
            done

            # Keep lobby previews paused until the new bot image is running.
            docker compose exec -T db sh -c \
              'psql -U "$POSTGRES_USER" "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
              "UPDATE channel_announcement_outbox
               SET available_at = NOW()
               WHERE dedupe_key LIKE '\''season9-lobby-preview-round-%'\''
                 AND status = '\''pending'\''"'

            for attempt in $(seq 1 30); do
              lobby_preview_delivery="$(docker compose exec -T db sh -c \
                'psql -U "$POSTGRES_USER" "$POSTGRES_DB" -At -c \
                "SELECT COUNT(*) FILTER (WHERE status = '\''sent'\'')
                    || '\''|'\'' ||
                    COUNT(*) FILTER (WHERE status <> '\''sent'\'')
                 FROM channel_announcement_outbox
                 WHERE dedupe_key LIKE '\''season9-lobby-preview-round-%'\''"')"
              if [ "$lobby_preview_delivery" = "14|0" ]; then
                echo "Delivered season 9 lobby preview announcements: 14"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose exec -T db sh -c \
                  'psql -U "$POSTGRES_USER" "$POSTGRES_DB" -c \
                  "SELECT dedupe_key, status, attempts, last_error
                   FROM channel_announcement_outbox
                   WHERE dedupe_key LIKE '\''season9-lobby-preview-round-%'\''
                   ORDER BY id"'
                docker compose logs --tail=200 bot
                exit 1
              fi
              sleep 3
            done

            scheduled_announcements="$(docker compose exec -T db sh -c \
              'psql -U "$POSTGRES_USER" "$POSTGRES_DB" -At -c \
              "SELECT COUNT(*) || '\''|'\'' ||
                      COUNT(*) FILTER (WHERE status = '\''failed'\'')
               FROM channel_announcement_outbox
               WHERE dedupe_key LIKE '\''season9-registration-round-%'\''"')"
            if [ "$scheduled_announcements" != "28|0" ]; then
              echo "Expected 28 scheduled season 9 announcements without failures, got $scheduled_announcements" >&2
              exit 1
            fi
            echo "Scheduled season 9 registration announcements: 28"

            # Keep the preview paused until the newly deployed bot is running.
            # Otherwise the outgoing version can consume it during migration.
            docker compose exec -T db sh -c \
              'psql -U "$POSTGRES_USER" "$POSTGRES_DB" -v ON_ERROR_STOP=1 -c \
              "UPDATE notification_outbox
               SET status = '\''pending'\'', available_at = NOW()
               WHERE event_type = '\''member_welcome_preview'\''
                 AND discord_id = 311247030422863882
                 AND status = '\''cancelled'\''"'

            for attempt in $(seq 1 30); do
              welcome_preview_status="$(docker compose exec -T db sh -c \
                'psql -U "$POSTGRES_USER" "$POSTGRES_DB" -At -c \
                "SELECT status
                 FROM notification_outbox
                 WHERE event_type = '\''member_welcome_preview'\''
                   AND discord_id = 311247030422863882
                 ORDER BY id DESC
                 LIMIT 1"')"
              if [ "$welcome_preview_status" = "sent" ]; then
                echo "Delivered member welcome preview to frokeng"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose exec -T db sh -c \
                  'psql -U "$POSTGRES_USER" "$POSTGRES_DB" -c \
                  "SELECT status, attempts, last_error
                   FROM notification_outbox
                   WHERE event_type = '\''member_welcome_preview'\''
                     AND discord_id = 311247030422863882
                   ORDER BY id DESC
                   LIMIT 1"'
                docker compose logs --tail=200 bot
                exit 1
              fi
              sleep 3
            done

            docker image prune --force
            docker compose ps
