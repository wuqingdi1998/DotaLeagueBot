name: Deploy (main)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bot/requirements.txt
            bot/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check bot
        working-directory: bot
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m compileall -q .
          pip-audit -r requirements.txt
          ruff check .
          mypy database/core.py database/migrate.py cogs/website_bridge.py utils/website_notifications.py
          python -m pytest
      - name: Check site
        working-directory: site
        run: |
          npm ci
          npm audit
          npm run check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Deploy bot, site and database migrations
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          command_timeout: 30m
          script: |
            set -euo pipefail

            APP_DIR=/root/DotaLeagueBot
            REPO=git@github.com:wuqingdi1998/DotaLeagueBot.git

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch main "$REPO" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "Missing $APP_DIR/.env. Copy .env.example and fill secrets." >&2
              exit 1
            fi

            # Bind mounts keep host ownership and override image-layer
            # permissions. The site runs as uid/gid 1001 and must be able to
            # create both team emblems and profile backgrounds.
            install -d -m 0775 -o 1001 -g 1001 \
              uploads_data \
              uploads_data/team-emblems \
              uploads_data/profile-backgrounds
            chown -R 1001:1001 uploads_data

            # Keep enough room for the next image build on the small server.
            # Active images and running containers are never removed.
            docker builder prune --all --force --filter "until=24h"
            docker image prune --all --force

            mkdir -p backups
            if docker compose ps --status running db | grep -q db; then
              backup="backups/postgres-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
              docker compose exec -T db sh -c \
                'pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' | gzip > "$backup"
            fi
            find backups -type f -name 'postgres-*.sql.gz' -mtime +14 -delete

            docker compose config --quiet
            docker compose build
            docker compose up -d db
            docker compose run --rm migrate

            # The old deployment used PM2. Stop it only after the new images build.
            if command -v pm2 >/dev/null 2>&1 && pm2 describe DotaLeagueBot >/dev/null 2>&1; then
              pm2 stop DotaLeagueBot
              pm2 delete DotaLeagueBot
              pm2 save
            fi

            docker compose up -d --no-deps --remove-orphans bot site proxy

            for attempt in $(seq 1 30); do
              if docker compose exec -T site node -e \
                "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose logs --tail=200 site bot migrate
                exit 1
              fi
              sleep 2
            done

            public_url="https://${SITE_DOMAIN:-lsesports.ru}/api/health"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --max-time 10 "$public_url" |
                grep -q '"ok":true'; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose logs --tail=200 proxy site
                exit 1
              fi
              sleep 5
            done

            docker compose ps
