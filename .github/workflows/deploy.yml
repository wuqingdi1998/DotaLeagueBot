name: Deploy (main)

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          script: |
            set -euo pipefail

            APP_DIR=/root/DotaLeagueBot
            REPO=git@github.com:wuqingdi1998/DotaLeagueBot.git

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone --branch main "$REPO" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            python3 -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install -r requirements.txt

            docker compose up -d db

            if pm2 describe DotaLeagueBot > /dev/null; then
              pm2 restart DotaLeagueBot --update-env
            else
              pm2 start main.py --name DotaLeagueBot --interpreter "$APP_DIR/.venv/bin/python"
            fi

            pm2 save
