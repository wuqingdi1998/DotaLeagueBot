name: Checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            bot/requirements.txt
            bot/requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall -q .
      - run: pip-audit -r requirements.txt
      - run: ruff check .
      - run: mypy database/core.py database/migrate.py cogs/website_bridge.py utils/website_notifications.py
      - run: python -m pytest --cov=. --cov-report=term-missing

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret validation environment
        run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d db
      - run: docker compose run --rm migrate
      - name: Verify shared schema
        run: |
          docker compose exec -T db psql \
            -U linkens_sphere -d linkens_sphere \
            -c "SELECT to_regclass('public.players'), to_regclass('public.tournaments'), to_regclass('public.notification_outbox');"
